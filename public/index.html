<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <style>
  body { font-family: Arial, sans-serif; }
</style>
</head>
<body>
  <h1>Expense Tracker</h1>
  <p id="message"></p>

  <h2>Add Expense</h2>
  <form id="addForm">
    <input type="text" id="description" placeholder="Description" required><br><br>
    <input type="text" id="category" placeholder="Category" required><br><br>
    <input type="number" id="amount" placeholder="Amount" step="0.01" required><br><br>
    <input type="date" id="date" required><br><br>
    <button type="submit">Add</button>
  </form>

  <h2>Search Expense by ID</h2>
  <input type="number" id="searchId" placeholder="Enter ID">
  <button id="searchBtn">Search</button>
  <button id="showAllBtn">Show All</button>

  <h2>Expenses</h2>
  <table cellpadding="5">
    <thead>
      <tr>
        <th>ID</th>
        <th>Description</th>
        <th>Category</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <h3>Total: <span id="total">0</span></h3>

  <script>
    const API = '/api/expenses';
    const tableBody = document.getElementById('tableBody');
    const message = document.getElementById('message');
    const totalText = document.getElementById('total');

    function renderRows(expenses) {
      tableBody.innerHTML = '';
      if (expenses.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6">No expenses found</td></tr>';
        return;
      }
      expenses.forEach(e => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${e.id}</td>
          <td>${e.description}</td>
          <td>${e.category}</td>
          <td>${e.amount}</td>
          <td>${e.date}</td>
          <td><button onclick="deleteExpense(${e.id})">Delete</button></td>
        `;
        tableBody.appendChild(row);
      });
    }

    async function loadExpenses() {
      const res = await fetch(API);
      const data = await res.json();
      renderRows(data);
      const total = data.reduce((sum, e) => sum + e.amount, 0);
      totalText.textContent = total.toFixed(2);
    }

    async function searchExpense() {
      const id = document.getElementById('searchId').value;
      if (!id) {
        message.textContent = 'Please enter an ID';
        return;
      }
      const res = await fetch(`${API}/${id}`);
      const data = await res.json();
      if (!res.ok) {
        message.textContent = data.error;
        renderRows([]);
        return;
      }
      message.textContent = 'Expense found';
      renderRows([data]);
    }

    async function deleteExpense(id) {
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) {
        message.textContent = data.error;
        return;
      }
      message.textContent = data.message;
      loadExpenses();
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        amount: document.getElementById('amount').value,
        date: document.getElementById('date').value
      };
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        message.textContent = data.error;
        return;
      }
      message.textContent = 'Expense added';
      e.target.reset();
      loadExpenses();
    });

    document.getElementById('searchBtn').addEventListener('click', searchExpense);
    document.getElementById('showAllBtn').addEventListener('click', () => {
      document.getElementById('searchId').value = '';
      message.textContent = '';
      loadExpenses();
    });

    loadExpenses();
  </script>
</body>
</html>
